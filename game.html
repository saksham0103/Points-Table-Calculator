<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-app">

<div class="container-fluid py-4">

    <div class="game-header">
        <h2>Live Scoreboard</h2>
        <div class="d-flex gap-2">
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
    🌙 Dark
</button>
            <button class="btn btn-outline-dark btn-sm" onclick="openHistory()">History</button>
            <button class="btn btn-outline-dark btn-sm" onclick="exportCSV()">Excel</button>
            <button class="btn btn-outline-dark btn-sm" onclick="exportPDF()">PDF</button>
            <button class="btn btn-outline-dark btn-sm" onclick="location.href='index.html'">New</button>
        </div>
    </div>

    <div id="nameSection" class="panel mb-4">
        <h5 class="mb-3">Enter Player Details</h5>
        <div id="playerInputs" class="row g-3"></div>
    </div>

    <div id="gameSection" style="display:none;">
        <div class="panel mb-4">
            <h5 id="roundTitle"></h5>
            <div id="scoreInputs" class="row g-3"></div>

            <div class="btn-row mt-3">
                <button class="btn btn-success" onclick="submitRound()">Submit</button>
                <button class="btn btn-warning" onclick="editPrevious()">Back</button>
                <button class="btn btn-danger" onclick="finishGame()">Finish</button>
            </div>
        </div>

        <div class="panel mb-4">
            <h5>Round History</h5>
            <div class="table-responsive">
                <table class="table table-bordered text-center">
                    <thead id="roundHead"></thead>
                    <tbody id="roundBody"></tbody>
                </table>
            </div>
        </div>

        <div class="panel">
            <h5>Total Scores</h5>
            <table class="table table-bordered text-center">
                <thead>
                    <tr><th>Rank</th><th>Player</th><th>Total</th></tr>
                </thead>
                <tbody id="totalBoard"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Winner Modal -->
<div class="modal fade" id="winnerModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content winner-panel text-center p-4">
      <h3 id="winnerText"></h3>
      <button class="btn btn-primary mt-3" data-bs-dismiss="modal">Close</button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="modal fade" id="historyModal">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content p-4">
      <h4>Match History</h4>
      <div id="historyContent"></div>
      <button class="btn btn-secondary mt-3" data-bs-dismiss="modal">Close</button>
    </div>
  </div>
</div>

<audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3"></audio>
<audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4f7c3b9b0c.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
